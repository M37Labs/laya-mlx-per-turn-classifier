[project]
name = "laya-classifier-per-turn"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1",
    "laya-mlx>=0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:laya-mlx. this checkpoint ships temperatures:RuntimeWarning"]
